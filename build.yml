name: Build Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build dengan Maven
        run: mvn -B clean package

      - name: Upload hasil jar
        uses: actions/upload-artifact@v4
        with:
          name: SpawnGroup-jar
          path: target/SpawnGroup.jar
